server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy configuration to forward API requests from frontend to backend (Optional)
    # If you want to use port 80 for both frontend and backend to avoid CORS issues:
    # 1. In frontend config, set VITE_API_BASE_URL=/v1/pharmatrace
    # 2. Uncomment the configuration block below:
    #
    # location /v1/pharmatrace/ {
    #     proxy_pass http://backend:3002/v1/pharmatrace/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
