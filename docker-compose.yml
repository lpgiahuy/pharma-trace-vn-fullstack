services:
  db:
    image: postgres:15-alpine
    container_name: pharmatrace-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HuyLe@574406}
      POSTGRES_DB: pharmatrace-vn-db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d # Directory containing database initialization SQL scripts
    networks:
      - pharmatrace-network

  backend:
    build:
      context: ./pharmatrace-vn-backend
      dockerfile: Dockerfile
    container_name: pharmatrace-backend
    restart: always
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - NODE_ENV=development
      - DB_HOST=db # Use the db service name of Docker Compose as database host
      - DB_PORT=5432
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:-HuyLe@574406}
      - DB_NAME=${DB_NAME:-pharmatrace-vn-db}
      - DATABASE_URL=postgresql://app_user:HuyLe%40574406@db:5432/pharmatrace-vn-db?schema=public
      - JWT_SECRET=${JWT_SECRET:-your_secret_key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - QR_SECRET_KEY=${QR_SECRET_KEY:-pharmatrace-vn-fallback-secret-qr-key-2026}
      - SWAGGER_USER=${SWAGGER_USER:-admin_huyle}
      - SWAGGER_PASS=${SWAGGER_PASS:-HuyLe@574406}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - API_GEMINI=${API_GEMINI:-your_gemini_api_key}
    ports:
      - "3002:3002"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
    networks:
      - pharmatrace-network

  frontend:
    build:
      context: ./pharmatrace-vn-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/v1/pharmatrace}
        - VITE_APP_NAME=${VITE_APP_NAME:-PharmaTrace VN}
    container_name: pharmatrace-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pharmatrace-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  pharmatrace-network:
    driver: bridge
